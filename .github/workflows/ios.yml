name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    name: Unsigned IPA (for sideloading)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Cache OpenCV
        id: cvcache
        uses: actions/cache@v4
        with:
          path: Vendor
          key: opencv-4.10.0-ios-framework

      - name: Fetch OpenCV
        if: steps.cvcache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p Vendor
          curl -sL -o /tmp/opencv.zip https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-ios-framework.zip
          unzip -q /tmp/opencv.zip -d Vendor
          ls Vendor/opencv2.framework | head -5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (device, unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Inkwell.xcodeproj \
            -scheme Inkwell \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | xcbeautify

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 2 -type d -name "*.app")
          echo "Found app bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Inkwell-unsigned.ipa Payload
          ls -la Inkwell-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inkwell-unsigned-ipa
          path: Inkwell-unsigned.ipa
          if-no-files-found: error
